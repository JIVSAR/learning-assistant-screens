<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>회원가입 - 이메일 입력 — 학습도우미</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; position: relative; background: var(--neutral-50); }
  .signup-shell { display: flex; align-items: center; justify-content: center; min-height: 800px; padding: 40px; }
  .signup-card { background: var(--white); border-radius: var(--r-lg); padding: 56px; max-width: 480px; width: 100%; border: 1px solid var(--neutral-200); }
  .stepper { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
  .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neutral-200); }
  .step-dot.active { background: var(--orange); }
  .step-dot.done { background: var(--green); }
  .step-line { flex: 1; height: 2px; background: var(--neutral-200); }
  .step-line.done { background: var(--orange); }
  .input-field { display: block; width: 100%; padding: 14px 16px; border: 1.5px solid var(--neutral-200); border-radius: var(--r-md); font-size: 14px; background: var(--white); margin-bottom: 6px; }
  .input-field.focus { border-color: var(--orange); }
  .helper { font-size: 12px; color: var(--neutral-500); }
  .helper.ok { color: var(--green); }
  .helper.error { color: var(--red); }
  .pw-strength { display: flex; gap: 4px; margin-top: 6px; height: 4px; }
  .pw-strength span { flex: 1; border-radius: 2px; background: var(--neutral-200); }
  .pw-strength.medium span:nth-child(-n+2) { background: var(--amber); }
</style></head>
<body>
<div class="page">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--neutral-200); background: var(--white);">
    <a href="#" style="text-decoration: none; display: flex; align-items: center; gap: 8px; color: var(--neutral-500); font-size: 14px;"><span>←</span><span>뒤로</span></a>
    <div style="font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; color: var(--navy);">📘 학습도우미 · 회원가입 (1/4)</div>
    <a href="#" style="text-decoration: none; color: var(--neutral-400); font-size: 18px;">✕</a>
  </div>

  <div class="signup-shell">
    <div class="signup-card">
      <div class="stepper">
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot active"></div><div class="step-line"></div>
        <div class="step-dot"></div><div class="step-line"></div>
        <div class="step-dot"></div><div class="step-line"></div>
        <div class="step-dot"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--neutral-500); margin-bottom: 32px; font-family: 'JetBrains Mono', monospace;">
        <span>METHOD</span><span style="color: var(--orange); font-weight: 700;">EMAIL</span><span>TERMS</span><span>VERIFY</span><span>PROFILE</span>
      </div>

      <h1 style="font-size: 26px; font-weight: 700; color: var(--neutral-900); margin-bottom: 24px;">계정 정보를 입력해주세요</h1>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">이메일</label>
        <input class="input-field focus" value="[email protected]" readonly>
        <div class="helper ok">✓ 사용 가능한 이메일이에요</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">비밀번호</label>
        <input class="input-field" type="password" value="••••••••" readonly>
        <div class="pw-strength medium"><span></span><span></span><span></span><span></span></div>
        <div class="helper" style="margin-top: 6px;">8~20자 · 영문·숫자·특수문자 조합 권장</div>
      </div>

      <div style="margin-bottom: 32px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">비밀번호 확인</label>
        <input class="input-field" type="password" value="••••••••" readonly>
        <div class="helper ok">✓ 비밀번호가 일치합니다</div>
      </div>

      <a href="#" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 15px; text-decoration: none;">
        다음 단계로 →
      </a>

      <div style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--neutral-400);">
        🔒 HTTPS 암호화 전송 · 비밀번호는 클라이언트에서 평문 저장 안 함
      </div>
    </div>
  </div>

  <div class="screen-id">P-AU-SU-02A · /auth/signup/email</div>
</div>
</body></html>
