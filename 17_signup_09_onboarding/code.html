<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>온보딩 - 학습도우미 사용법 — 학습도우미</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; position: relative; background: var(--neutral-50); }
  .ob-shell { display: flex; align-items: center; justify-content: center; min-height: 900px; padding: 40px; }
  .ob-card { background: var(--white); border-radius: var(--r-lg); padding: 56px; max-width: 720px; width: 100%; border: 1px solid var(--neutral-200); }
</style></head>
<body>
<div class="page">
  <div class="ob-shell">
    <div class="ob-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--orange); font-weight: 700;">1 / 4 단계 · 온보딩</div>
        <a href="../02_dashboard/code.html" style="font-size: 12px; color: var(--neutral-500); text-decoration: none;">건너뛰기 ✕</a>
      </div>

      <!-- Visual -->
      <div style="background: linear-gradient(135deg, var(--orange-soft) 0%, var(--info-soft) 100%); border-radius: var(--r-md); padding: 48px; text-align: center; margin-bottom: 32px;">
        <div style="font-size: 96px; margin-bottom: 8px;">🎯</div>
        <div style="display: inline-flex; gap: 16px; padding: 16px 24px; background: var(--white); border-radius: var(--r-full); font-size: 13px;">
          <div>📚 정보처리기사</div>
          <div style="color: var(--neutral-300);">|</div>
          <div>⏱ 3시간/일</div>
          <div style="color: var(--neutral-300);">|</div>
          <div>🔥 14일 연속</div>
        </div>
      </div>

      <h1 style="font-size: 28px; font-weight: 700; color: var(--neutral-900); margin-bottom: 12px; text-align: center;">목표를 설정하고 학습을 시작하세요</h1>
      <p style="font-size: 14px; color: var(--neutral-500); line-height: 1.7; text-align: center; margin-bottom: 32px;">
        매일 목표를 설정하면 학습 데이터가 자동으로 기록되고,<br>
        흑역사 위험도가 실시간으로 갱신됩니다. 목표 미달성 시 패널티가 발동돼요.
      </p>

      <!-- Page indicator dots -->
      <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 32px;">
        <span style="width: 24px; height: 8px; border-radius: 4px; background: var(--orange);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
      </div>

      <!-- Next 4 steps preview -->
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;">
        <div style="text-align: center; padding: 12px; border: 1.5px solid var(--orange); background: var(--orange-soft); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px;">🎯</div>
          <div style="font-size: 11px; font-weight: 700; color: var(--orange);">목표·타이머</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🔒</div>
          <div style="font-size: 11px; color: var(--neutral-500);">흑역사 시스템</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🏆</div>
          <div style="font-size: 11px; color: var(--neutral-500);">커뮤니티·전당</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🛒</div>
          <div style="font-size: 11px; color: var(--neutral-500);">보상·상점</div>
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <a href="../02_dashboard/code.html" style="flex: 0 0 140px; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: var(--r-md); background: var(--white); color: var(--neutral-500); border: 1.5px solid var(--neutral-200); font-weight: 600; font-size: 13px; text-decoration: none;">건너뛰기</a>
        <a href="../02_dashboard/code.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 14px; text-decoration: none;">다음 →</a>
      </div>
    </div>
  </div>

  <div class="screen-id">P-AU-SU-09 · /onboarding</div>
</div>
</body></html>
