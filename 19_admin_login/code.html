<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>관리자 로그인 — 학습도우미</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/admin.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  html { background: #000000; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; background: #000000; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; background: #000000; position: relative; }
  .login-shell { display: flex; align-items: center; justify-content: center; min-height: 900px; padding: 40px; }
  .login-card { background: #1E293B; border-radius: var(--r-lg); padding: 48px; max-width: 440px; width: 100%; border: 1px solid rgba(255,255,255,0.1); color: var(--white); }
  .input-field { display: block; width: 100%; padding: 12px 14px; background: #0F172A; border: 1.5px solid rgba(255,255,255,0.1); border-radius: var(--r-md); font-size: 14px; color: var(--white); margin-bottom: 16px; }
  .code-input { display: flex; gap: 6px; }
  .code-input span { flex: 1; height: 44px; background: #0F172A; border: 1.5px solid rgba(255,255,255,0.1); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-family: 'Hanken Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--white); }
</style></head>
<body>
<div class="page">
  <div class="login-shell">
    <div class="login-card">
      <!-- Header -->
      <div style="text-align: center; margin-bottom: 32px;">
        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--red); border-radius: var(--r-sm); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 16px;">🛡️ 관리자 접근</div>
        <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 8px;"><span style="display: inline-block; width: 28px; height: 28px; background: url('../assets/logo.svg') no-repeat center / contain;"></span>학습도우미 관리자</h1>
        <p style="font-size: 13px; color: rgba(255,255,255,0.5);">보안 로그인 · 2단계 인증 필수</p>
      </div>

      <!-- Email -->
      <div>
        <label style="font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); margin-bottom: 6px; display: block;">이메일</label>
        <input class="input-field" value="admin@studyguard.kr" readonly>
      </div>

      <!-- Password -->
      <div>
        <label style="font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); margin-bottom: 6px; display: block;">비밀번호</label>
        <input class="input-field" type="password" value="••••••••" readonly>
      </div>

      <!-- 2FA -->
      <div style="margin-bottom: 24px;">
        <label style="font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); margin-bottom: 6px; display: block;">2단계 인증 코드 (Google Authenticator)</label>
        <div class="code-input">
          <span>4</span><span>9</span><span>2</span><span>7</span><span>1</span><span>3</span>
        </div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px;">⏱ 30초마다 갱신 · 남은 시간 18초</div>
      </div>

      <!-- Submit -->
      <a href="../20_admin_dashboard/code.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 14px; text-decoration: none; margin-bottom: 20px;">
        🔐 관리자 로그인
      </a>

      <!-- Security notice -->
      <div style="padding: 12px; background: #0F172A; border-radius: var(--r-sm); font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6;">
        🛡️ <strong style="color: var(--orange);">보안 안내</strong><br>
        · 로그인 시도 5회 실패 시 해당 IP 1시간 자동 차단<br>
        · 비밀번호 분실 시 시스템 관리자에게 문의<br>
        · 모든 활동은 감사 로그에 기록됩니다
      </div>
    </div>
  </div>

  <div class="screen-id" style="color: rgba(255,255,255,0.3);">P-BE-LI-00 · /admin/login</div>
</div>
</body></html>
