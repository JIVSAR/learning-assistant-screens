<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>회원가입 - 프로필 설정 — 학습도우미</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 1050px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 1050px; position: relative; background: var(--neutral-50); }
  .signup-shell { display: flex; align-items: center; justify-content: center; min-height: 950px; padding: 40px; }
  .signup-card { background: var(--white); border-radius: var(--r-lg); padding: 48px 56px; max-width: 520px; width: 100%; border: 1px solid var(--neutral-200); }
  .stepper { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
  .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neutral-200); }
  .step-dot.active { background: var(--orange); }
  .step-dot.done { background: var(--green); }
  .step-line { flex: 1; height: 2px; background: var(--neutral-200); }
  .step-line.done { background: var(--orange); }
  .input-field { display: block; width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-200); border-radius: var(--r-md); font-size: 14px; }
  .chip { padding: 8px 14px; border: 1.5px solid var(--neutral-200); border-radius: var(--r-full); font-size: 13px; color: var(--neutral-700); display: inline-block; }
  .chip.selected { background: var(--orange); color: var(--white); border-color: var(--orange); font-weight: 600; }
  .radio-btn { padding: 10px 14px; border: 1.5px solid var(--neutral-200); border-radius: var(--r-md); font-size: 13px; flex: 1; text-align: center; }
  .radio-btn.selected { border-color: var(--orange); color: var(--orange); font-weight: 700; background: var(--orange-soft); }
  .avatar-pick { width: 56px; height: 56px; border-radius: 50%; background: var(--neutral-100); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
  .avatar-pick.selected { background: var(--orange); border: 3px solid var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
</style></head>
<body>
<div class="page">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--neutral-200); background: var(--white);">
    <a href="../12_signup_04_verify/code.html" style="text-decoration: none; color: var(--neutral-500); font-size: 14px;">← 뒤로</a>
    <div style="font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; color: var(--navy); display: inline-flex; align-items: center; gap: 6px;"><span style="display: inline-block; width: 24px; height: 24px; background: url('../assets/logo.svg') no-repeat center / contain;"></span>학습도우미 · 회원가입 (5/5)</div>
    <a href="../01_main/code.html" style="text-decoration: none; color: var(--neutral-400); font-size: 18px;">✕</a>
  </div>

  <div class="signup-shell">
    <div class="signup-card">
      <div class="stepper">
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot active"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--neutral-500); margin-bottom: 24px; font-family: 'JetBrains Mono', monospace;">
        <span>가입방법</span><span>계정</span><span>약관</span><span>인증</span><span style="color: var(--orange); font-weight: 700;">프로필</span>
      </div>

      <h1 style="font-size: 24px; font-weight: 700; color: var(--neutral-900); margin-bottom: 24px;">프로필을 설정해주세요</h1>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">닉네임 <span style="color: var(--neutral-400); font-weight: 400;">(2~10자)</span></label>
        <input class="input-field" value="도전" readonly style="border-color: var(--orange);">
        <div style="font-size: 12px; color: var(--green); margin-top: 4px;">✓ 사용 가능</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 8px; display: block;">관심 과목 <span style="color: var(--red);">*</span> <span style="color: var(--neutral-400); font-weight: 400; font-size: 11px;">1개 이상 필수</span></label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <span class="chip selected">수능/입시</span>
          <span class="chip">자격증</span>
          <span class="chip">어학</span>
          <span class="chip selected">코딩</span>
          <span class="chip">전공공부</span>
          <span class="chip">기타</span>
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 8px; display: block;">하루 평균 학습 목표 시간</label>
        <div style="display: flex; gap: 6px;">
          <div class="radio-btn">1h 이하</div>
          <div class="radio-btn selected">1~3h</div>
          <div class="radio-btn">3~5h</div>
          <div class="radio-btn">5h 이상</div>
        </div>
      </div>

      <div style="margin-bottom: 28px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 8px; display: block;">아바타 선택 <span style="color: var(--neutral-400); font-weight: 400; font-size: 11px;">(가입 후 변경 가능)</span></label>
        <div style="display: flex; gap: 8px;">
          <div class="avatar-pick">🦊</div>
          <div class="avatar-pick">🐱</div>
          <div class="avatar-pick">🐰</div>
          <div class="avatar-pick selected">🐻</div>
          <div class="avatar-pick">🦉</div>
          <div class="avatar-pick">🐯</div>
        </div>
      </div>

      <a href="../14_signup_06_vault_intro/code.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 15px; text-decoration: none;">
        다음 →
      </a>
    </div>
  </div>

  <div class="screen-id">P-FE-SU-20 · /auth/signup/profile</div>
</div>
</body></html>
